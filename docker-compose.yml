services:
  # VMware Avi LLM Agent
  avi-llm-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8088}:${SERVER_PORT:-8088}"
    environment:
      # Avi Load Balancer Configuration
      - AVI_HOST=${AVI_HOST:-avi-controller.example.com}
      - AVI_USERNAME=${AVI_USERNAME:-admin}
      - AVI_PASSWORD=${AVI_PASSWORD:-password}
      - AVI_VERSION=${AVI_VERSION:-31.2.1}
      - AVI_TENANT=${AVI_TENANT:-admin}
      - AVI_TIMEOUT=${AVI_TIMEOUT:-30}
      - AVI_INSECURE=${AVI_INSECURE:-false}
      - AVI_AUTH_METHOD=${AVI_AUTH_METHOD:-session}

      # Avi MCP server (comprehensive Avi API tool calling; falls back to the
      # built-in tool set if disabled or unreachable)
      - AVI_MCP_ENABLED=${AVI_MCP_ENABLED:-true}
      - AVI_MCP_COMMAND=${AVI_MCP_COMMAND:-node}
      - AVI_MCP_SERVER_PATH=${AVI_MCP_SERVER_PATH:-}

      # LLM Provider Configuration (default to python for better reliability)
      - LLM_PROVIDER=${LLM_PROVIDER:-python}

      # Ollama Configuration (used when LLM_PROVIDER=ollama)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.2}
      - OLLAMA_MODELS=${OLLAMA_MODELS:-llama3.2,mistral,codellama}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-2048}

      # Python Mistral Configuration (used when LLM_PROVIDER=python)
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_API_BASE_URL=${MISTRAL_API_BASE_URL:-https://api.mistral.ai}
      - MISTRAL_DEFAULT_MODEL=${MISTRAL_DEFAULT_MODEL:-mistral-medium}
      - MISTRAL_MODELS=${MISTRAL_MODELS:-mistral-tiny,mistral-small,mistral-medium}
      - MISTRAL_TIMEOUT=${MISTRAL_TIMEOUT:-60}
      - MISTRAL_TEMPERATURE=${MISTRAL_TEMPERATURE:-0.7}
      - MISTRAL_MAX_TOKENS=${MISTRAL_MAX_TOKENS:-2048}

      # Server Configuration
      - GIN_MODE=release
      - SERVER_PORT=${SERVER_PORT:-8088}
      - SERVER_READ_TIMEOUT=${SERVER_READ_TIMEOUT:-30}
      - SERVER_WRITE_TIMEOUT=${SERVER_WRITE_TIMEOUT:-30}
      - SERVER_IDLE_TIMEOUT=${SERVER_IDLE_TIMEOUT:-60}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}

      # Chat session persistence (one JSONL file per session, 30-day expiry)
      - SESSIONS_DIR=${SESSIONS_DIR:-/web/data/sessions}
    volumes:
      - ./config.yaml:/etc/aviagent/config.yaml:ro
      - aviagent-sessions:/web/data/sessions
    networks:
      - avi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:${SERVER_PORT:-8088}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ollama LLM Service (only used when LLM_PROVIDER=ollama)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #   networks:
  #     - avi-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

networks:
  avi-network:
    driver: bridge

volumes:
  aviagent-sessions: