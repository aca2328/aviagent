services:
  # VMware Avi LLM Agent
  avi-llm-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Avi Load Balancer Configuration
      - AVI_HOST=${AVI_HOST:-avi-controller.example.com}
      - AVI_USERNAME=${AVI_USERNAME:-admin}
      - AVI_PASSWORD=${AVI_PASSWORD:-password}
      - AVI_VERSION=${AVI_VERSION:-31.2.1}
      - AVI_TENANT=${AVI_TENANT:-admin}
      - AVI_TIMEOUT=${AVI_TIMEOUT:-30}
      - AVI_INSECURE=${AVI_INSECURE:-false}

      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}

      # Ollama Configuration (used when LLM_PROVIDER=ollama)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.2}
      - OLLAMA_MODELS=${OLLAMA_MODELS:-llama3.2,mistral,codellama}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-2048}

      # Mistral AI Configuration (used when LLM_PROVIDER=mistral)
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_API_BASE_URL=${MISTRAL_API_BASE_URL:-https://api.mistral.ai}
      - MISTRAL_DEFAULT_MODEL=${MISTRAL_DEFAULT_MODEL:-mistral-medium}
      - MISTRAL_MODELS=${MISTRAL_MODELS:-mistral-tiny,mistral-small,mistral-medium}
      - MISTRAL_TIMEOUT=${MISTRAL_TIMEOUT:-60}
      - MISTRAL_TEMPERATURE=${MISTRAL_TEMPERATURE:-0.7}
      - MISTRAL_MAX_TOKENS=${MISTRAL_MAX_TOKENS:-2048}

      # Langfuse Configuration
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-1234567890}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-1234567890}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      - LANGFUSE_DEBUG=${LANGFUSE_DEBUG:-false}
      - LANGFUSE_FLUSH_INTERVAL=${LANGFUSE_FLUSH_INTERVAL:-5}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}

      # Server Configuration
      - GIN_MODE=release
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_READ_TIMEOUT=${SERVER_READ_TIMEOUT:-30}
      - SERVER_WRITE_TIMEOUT=${SERVER_WRITE_TIMEOUT:-30}
      - SERVER_IDLE_TIMEOUT=${SERVER_IDLE_TIMEOUT:-60}
    volumes:
      - ./config.yaml:/etc/aviagent/config.yaml:ro
    depends_on:
      ollama:
        condition: service_healthy
        required: false  # Only required when using Ollama
    networks:
      - avi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ollama LLM Service (only used when LLM_PROVIDER=ollama)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - avi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - avi-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - avi-network
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      - prometheus

  # PostgreSQL for Langfuse (required for metadata and auth)
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - avi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ClickHouse for Langfuse (required for analytics and events)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=langfuse
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    networks:
      - avi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Langfuse Observability Platform
  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3001:3000"  # Host:3001 → Container:3000 (avoiding conflict with Grafana)
    environment:
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-secret-key-for-langfuse}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-public-key-for-langfuse}
      - LANGFUSE_HOST=http://langfuse:3000
      - DATABASE_URL=postgresql://langfuse:langfuse@postgres:5432/langfuse
      - CLICKHOUSE_URL=clickhouse://clickhouse:8123/langfuse
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:8123/langfuse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=langfuse
      - CLICKHOUSE_DATABASE=langfuse
      - NEXTAUTH_URL=http://langfuse:3000
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-super-secret-nextauth-secret}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - avi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://langfuse:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s



volumes:
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local

networks:
  avi-network:
    driver: bridge
